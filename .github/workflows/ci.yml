name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-control-centre-${{ matrix.os }}
          path: |
            target/release/agent-control-centre
            target/release/acc
            target/release/agent-control-centre.exe
            target/release/acc.exe
