name: CI
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps (notifications/windowing are dlopen'd; nothing needed to build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: agent-control-centre-${{ runner.os }}
          path: |
            target/release/agent-control-centre
            target/release/agent-control-centre.exe
