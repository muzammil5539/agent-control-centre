[workspace]
members = ["core"]

[package]
name = "agent-control-centre"
version = "0.3.0"
edition = "2024"
description = "Always-on-top native HUD to monitor, approve and control AI agents on your machine"
license = "MIT"

[dependencies]
acc-core = { path = "core" }
# glow (OpenGL) instead of the default wgpu renderer: far smaller idle memory for a small HUD.
eframe = { version = "0.37.0", default-features = false, features = ["persistence", "glow", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
global-hotkey = "0.10.0"
notify-rust = "4.19.0"
serde_json = "1.0.154"
tiny_http = "0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = false # keeps target/debug small
